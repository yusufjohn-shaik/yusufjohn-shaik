<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="auto" shape-rendering="crispEdges">
  <defs>
    <!-- Filter for soft neon glow effects -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Swaying animation for foliage */
    .breeze-group {
      transform-origin: 160px 170px;
      animation: gentle-breeze 5s ease-in-out infinite alternate;
    }
    @keyframes gentle-breeze {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(1.2deg) skewX(0.5deg); }
      100% { transform: rotate(-0.8deg); }
    }

    /* Breathing neon pulse for highlights */
    .neon-pulse {
      animation: breathe 3.5s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      0% { opacity: 0.75; }
      50% { opacity: 1; }
      100% { opacity: 0.85; }
    }

    /* Lantern gentle sway */
    .lantern-sway {
      transform-origin: 226px 132px;
      animation: lantern-swing 3.2s ease-in-out infinite alternate;
    }
    @keyframes lantern-swing {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    /* Falling petal keyframes */
    @keyframes petal-drift-1 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% { transform: translate(-38px, 140px) rotate(140deg); opacity: 0; }
    }
    @keyframes petal-drift-2 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      12% { opacity: 1; }
      80% { opacity: 0.85; }
      100% { transform: translate(42px, 155px) rotate(-160deg); opacity: 0; }
    }
    @keyframes petal-drift-3 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.75; }
      100% { transform: translate(-22px, 130px) rotate(90deg); opacity: 0; }
    }
    @keyframes petal-drift-4 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% { transform: translate(30px, 145px) rotate(-110deg); opacity: 0; }
    }

    .petal-1 { animation: petal-drift-1 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .petal-2 { animation: petal-drift-2 6.4s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite; }
    .petal-3 { animation: petal-drift-3 4.8s cubic-bezier(0.4, 0, 0.2, 1) 2.8s infinite; }
    .petal-4 { animation: petal-drift-4 5.8s cubic-bezier(0.4, 0, 0.2, 1) 0.8s infinite; }
    .petal-5 { animation: petal-drift-1 5.6s cubic-bezier(0.4, 0, 0.2, 1) 3.6s infinite; }
  </style>

  <!-- Background Ambience & Pedestal Grid -->
  <g opacity="0.6">
    <!-- Clean Minimal Stand Surface -->
    <rect x="70" y="254" width="180" height="2" fill="#1e293b" />
    <rect x="100" y="255" width="120" height="1" fill="#38bdf8" opacity="0.4" filter="url(#subtle-glow)" />
  </g>

  <!-- Bonsai Planter Pot -->
  <g id="pot">
    <!-- Stand Feet -->
    <rect x="106" y="246" width="14" height="6" fill="#090d16" />
    <rect x="200" y="246" width="14" height="6" fill="#090d16" />
    <rect x="108" y="249" width="10" height="3" fill="#1e293b" />
    <rect x="202" y="249" width="10" height="3" fill="#1e293b" />

    <!-- Pot Body Base -->
    <polygon points="102,224 218,224 212,246 108,246" fill="#0b1120" />
    <polygon points="104,226 216,226 211,244 109,244" fill="#0f172a" />
    <polygon points="106,228 150,228 147,242 110,242" fill="#131d33" />

    <!-- Pot Cyber Neon Accent Line -->
    <rect x="110" y="236" width="100" height="3" fill="#0284c7" />
    <rect x="112" y="237" width="96" height="1.5" fill="#38bdf8" class="neon-pulse" filter="url(#subtle-glow)" />

    <!-- Pot Upper Rim -->
    <rect x="96" y="218" width="128" height="6" fill="#1e293b" />
    <rect x="98" y="219" width="124" height="2" fill="#334155" />
    <rect x="98" y="222" width="124" height="2" fill="#0f172a" />

    <!-- Soil and Cyber Moss -->
    <rect x="104" y="213" width="112" height="5" fill="#111827" />
    <!-- Moss clusters -->
    <rect x="108" y="213" width="8" height="3" fill="#0369a1" />
    <rect x="120" y="214" width="12" height="2" fill="#0284c7" />
    <rect x="136" y="213" width="10" height="3" fill="#0ea5e9" opacity="0.8" />
    <rect x="174" y="213" width="14" height="3" fill="#0284c7" />
    <rect x="192" y="214" width="10" height="2" fill="#0369a1" />
    <rect x="124" y="213" width="4" height="2" fill="#38bdf8" opacity="0.7" />
    <rect x="180" y="213" width="4" height="2" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Gnarled Bonsai Wood Trunk & Main Branches -->
  <g id="trunk">
    <!-- Root base flare -->
    <polygon points="144,213 176,213 170,202 150,202" fill="#1a202c" />
    <polygon points="148,213 162,213 158,202 152,202" fill="#2d3748" />

    <!-- Lower Trunk (sweeping gently left) -->
    <polygon points="150,202 170,202 165,182 143,182" fill="#1a202c" />
    <polygon points="152,202 164,202 160,182 147,182" fill="#242d3d" />
    <rect x="150" y="186" width="4" height="12" fill="#3b485d" />

    <!-- Mid Trunk curve (turning right) -->
    <polygon points="143,182 165,182 176,158 155,158" fill="#1a202c" />
    <polygon points="147,182 161,182 171,158 158,158" fill="#242d3d" />
    <rect x="160" y="162" width="4" height="16" fill="#3b485d" />

    <!-- Left Branch Structure -->
    <polygon points="147,178 153,172 116,152 112,157" fill="#1a202c" />
    <polygon points="112,157 116,152 94,142 92,146" fill="#242d3d" />
    <rect x="92" y="142" width="16" height="3" fill="#1a202c" />
    <rect x="108" y="148" width="8" height="2" fill="#3b485d" />

    <!-- Central Apex Trunk Upward -->
    <polygon points="157,158 174,158 168,124 154,124" fill="#1a202c" />
    <polygon points="160,158 170,158 165,124 157,124" fill="#242d3d" />
    <polygon points="154,124 168,124 164,96 156,96" fill="#1a202c" />
    <polygon points="157,124 165,124 162,96 158,96" fill="#242d3d" />

    <!-- Right Extended Sweeping Branch -->
    <polygon points="168,146 175,152 208,138 206,132" fill="#1a202c" />
    <polygon points="206,132 208,138 234,128 232,122" fill="#242d3d" />
    <polygon points="232,122 234,128 248,124 246,120" fill="#1a202c" />
    <rect x="204" y="132" width="14" height="3" fill="#3b485d" />
  </g>

  <!-- Hanging Cyber Lantern on Right Branch -->
  <g class="lantern-sway" id="lantern">
    <!-- Thin Suspension Cord -->
    <line x1="226" y1="126" x2="226" y2="138" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <!-- Lantern Cap -->
    <rect x="222" y="138" width="8" height="2" fill="#1e293b" />
    <!-- Lantern Core / Glow Body -->
    <rect x="223" y="140" width="6" height="8" fill="#0284c7" />
    <rect x="224" y="141" width="4" height="6" fill="#38bdf8" filter="url(#subtle-glow)" class="neon-pulse" />
    <rect x="225" y="142" width="2" height="4" fill="#ffffff" opacity="0.9" />
    <!-- Lantern Bottom Rim & Tassel -->
    <rect x="222" y="148" width="8" height="2" fill="#1e293b" />
    <line x1="226" y1="150" x2="226" y2="155" stroke="#38bdf8" stroke-width="1" opacity="0.7" />
  </g>

  <!-- Foliage Tier Clusters with Ambient Breeze Sway -->
  <g class="breeze-group" id="foliage">
    <!-- CLUSTER 1: Left Tier Cloud (Centering ~98, 134) -->
    <g id="cloud-left">
      <!-- Deep shadow background foliage -->
      <rect x="74" y="136" width="48" height="18" rx="2" fill="#0369a1" />
      <rect x="80" y="128" width="38" height="26" rx="2" fill="#0369a1" />
      <!-- Mid-tone Electric Blue -->
      <rect x="78" y="132" width="42" height="16" rx="2" fill="#0284c7" />
      <rect x="84" y="124" width="30" height="20" rx="2" fill="#0ea5e9" />
      <rect x="72" y="138" width="16" height="8" rx="2" fill="#0ea5e9" />
      <!-- Vibrant Highlights -->
      <rect x="88" y="122" width="22" height="10" rx="1" fill="#38bdf8" />
      <rect x="76" y="134" width="14" height="6" rx="1" fill="#38bdf8" />
      <rect x="104" y="130" width="12" height="6" rx="1" fill="#38bdf8" />
      <!-- Pixel Sparkles -->
      <rect x="92" y="120" width="8" height="3" fill="#bae6fd" class="neon-pulse" />
      <rect x="80" y="132" width="6" height="3" fill="#ffffff" opacity="0.8" />
      <rect x="108" y="128" width="6" height="3" fill="#bae6fd" />
    </g>

    <!-- CLUSTER 2: Top Apex Cloud (Centering ~160, 78) -->
    <g id="cloud-apex">
      <!-- Deep shadow background foliage -->
      <rect x="132" y="74" width="62" height="28" rx="3" fill="#0369a1" />
      <rect x="140" y="64" width="46" height="34" rx="3" fill="#0369a1" />
      <rect x="148" y="56" width="30" height="20" rx="2" fill="#0369a1" />
      <!-- Mid-tone Electric Blue -->
      <rect x="136" y="70" width="54" height="22" rx="2" fill="#0284c7" />
      <rect x="144" y="60" width="38" height="24" rx="2" fill="#0ea5e9" />
      <!-- Vibrant Highlights -->
      <rect x="148" y="54" width="28" height="14" rx="2" fill="#38bdf8" />
      <rect x="138" y="68" width="18" height="10" rx="1" fill="#38bdf8" />
      <rect x="168" y="66" width="18" height="10" rx="1" fill="#38bdf8" />
      <!-- Peak Crown Pixel Sparkles -->
      <rect x="154" y="50" width="16" height="5" fill="#bae6fd" class="neon-pulse" filter="url(#subtle-glow)" />
      <rect x="158" y="52" width="8" height="2" fill="#ffffff" />
      <rect x="142" y="64" width="6" height="3" fill="#bae6fd" />
      <rect x="174" y="62" width="6" height="3" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- CLUSTER 3: Right Swept Tier Cloud (Centering ~226, 110) -->
    <g id="cloud-right">
      <!-- Deep shadow background foliage -->
      <rect x="194" y="110" width="60" height="24" rx="3" fill="#0369a1" />
      <rect x="204" y="100" width="44" height="28" rx="2" fill="#0369a1" />
      <!-- Mid-tone Electric Blue -->
      <rect x="198" y="106" width="52" height="20" rx="2" fill="#0284c7" />
      <rect x="208" y="98" width="34" height="20" rx="2" fill="#0ea5e9" />
      <!-- Vibrant Highlights -->
      <rect x="212" y="94" width="24" height="12" rx="1" fill="#38bdf8" />
      <rect x="202" y="104" width="16" height="8" rx="1" fill="#38bdf8" />
      <rect x="234" y="106" width="14" height="8" rx="1" fill="#38bdf8" />
      <!-- Pixel Sparkles -->
      <rect x="216" y="92" width="12" height="3" fill="#bae6fd" class="neon-pulse" />
      <rect x="220" y="93" width="6" height="2" fill="#ffffff" />
      <rect x="240" y="102" width="6" height="3" fill="#bae6fd" />
    </g>
  </g>

  <!-- Animated Drifting Cyber Petals -->
  <g id="petals">
    <!-- Petal 1 (Drifting from apex toward left) -->
    <g class="petal-1" transform="translate(148, 85)">
      <rect x="0" y="0" width="3" height="3" fill="#38bdf8" filter="url(#subtle-glow)" />
      <rect x="1" y="1" width="1.5" height="1.5" fill="#ffffff" />
    </g>

    <!-- Petal 2 (Drifting from right branch downward) -->
    <g class="petal-2" transform="translate(230, 120)">
      <rect x="0" y="0" width="3" height="3" fill="#7dd3fc" filter="url(#subtle-glow)" />
      <rect x="1" y="0.5" width="1.5" height="1.5" fill="#ffffff" />
    </g>

    <!-- Petal 3 (Drifting from left tier) -->
    <g class="petal-3" transform="translate(95, 145)">
      <rect x="0" y="0" width="2.5" height="2.5" fill="#38bdf8" />
      <rect x="0.5" y="0.5" width="1.5" height="1.5" fill="#ffffff" />
    </g>

    <!-- Petal 4 (Drifting from mid-apex toward right) -->
    <g class="petal-4" transform="translate(175, 95)">
      <rect x="0" y="0" width="3" height="2.5" fill="#0ea5e9" filter="url(#subtle-glow)" />
      <rect x="1" y="0.5" width="1.5" height="1.5" fill="#bae6fd" />
    </g>

    <!-- Petal 5 (Floating near pot) -->
    <g class="petal-5" transform="translate(125, 110)">
      <rect x="0" y="0" width="2.5" height="2.5" fill="#38bdf8" />
    </g>
  </g>
</svg>
